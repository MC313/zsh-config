- defaults:
    link:
      create: true
      force: true
      relink: true

  clean: ['~']

# Shell Config
- link:
    ~/.zshenv: zsh/.zshenv
    ~/.zsh/.zshrc: zsh/.zshrc
    ~/.zsh/.zprofile: zsh/.zprofile
    ~/.zsh/.zsh_aliases: zsh/.zsh_aliases
    ~/.zsh/plugins: zsh/plugins
    ~/.zsh/.config/starship.toml: config/starship.toml

- shell:

    - description: Install zsh and set it as the default shell
      command: |
        if command -v zsh >/dev/null; then
            echo "zsh is already installed. Attempting to set as default shell..."
            ZSH_PATH=$(which zsh)
            if [ -n "$ZSH_PATH" ]; then
                echo "Setting zsh as the default shell. You might need to enter your password."
                chsh -s "$ZSH_PATH"
            else
                echo "zsh installed, but couldn't set it as default. Please set it manually."
            fi
        else
            echo "zsh is not installed. Attempting to install and set as default shell..."
            if [ "$(uname)" = "Linux" ]; then
                sudo apt update && sudo apt install zsh -y
            elif [ "$(uname)" = "Darwin" ]; then
                brew install zsh
            else
                echo "Unsupported operating system for automatic installation."
                exit 1
            fi

            ZSH_PATH=$(which zsh)
            if [ -n "$ZSH_PATH" ]; then
                echo "Setting zsh as the default shell. You might need to enter your password."
                chsh -s "$ZSH_PATH"
                echo "zsh installed and set as the default shell successfully!!"
                echo "You may need to logout and log back in for shell changes to take effect."
            else
                echo "zsh installed, but couldn't set it as default. Please set it manually."
            fi
        fi

    - description: Fixing pnpm directory permissions
      command: |
        if [ "$(uname -s)" = "Darwin" ]; then
            PNPM_HOME="$HOME/Library/pnpm"
        else
            PNPM_HOME="$HOME/.local/share/pnpm"
        fi

        # Check if pnpm directory exists and has wrong ownership
        if [ -d "$PNPM_HOME" ]; then
            if [ "$(uname -s)" = "Darwin" ]; then
                OWNER=$(stat -f '%Su' "$PNPM_HOME" 2>/dev/null)
            else
                OWNER=$(stat -c '%U' "$PNPM_HOME" 2>/dev/null)
            fi

            if [ "$OWNER" = "root" ]; then
                echo "Fixing ownership on $PNPM_HOME (requires password)..."
                sudo chown -R "$(whoami):$(id -gn)" "$PNPM_HOME"
                sudo chmod -R u+rwx "$PNPM_HOME"
                echo "✓ Fixed pnpm directory ownership"
            fi
        else
            # Create directory with correct permissions if it doesn't exist
            mkdir -p "$PNPM_HOME"
            echo "✓ Created pnpm directory with user ownership"
        fi
      stdout: true

    - description: Installing submodules
      command: git submodule update --init --recursive
      stdout: true

    - description: Installing starship
      command: curl -fsSL https://starship.rs/install.sh | sh
      stdout: true

    - description: Configuring pnpm home directory
      command: |
        if command -v pnpm >/dev/null 2>&1; then
            if [ "$(uname -s)" = "Darwin" ]; then
                PNPM_HOME="$HOME/Library/pnpm"
            else
                PNPM_HOME="$HOME/.local/share/pnpm"
            fi
            if [ "$(uname -s)" = "Darwin" ]; then
                PNPM_BIN_DIR="$PNPM_HOME"
            else
                # Preserve Ubuntu's existing ~/.local/share/pnpm/bin layout.
                PNPM_BIN_DIR="$PNPM_HOME/bin"
            fi
            mkdir -p "$PNPM_BIN_DIR"
            pnpm config set home-dir "$PNPM_HOME"
            pnpm config set global-bin-dir "$PNPM_BIN_DIR"
            echo "pnpm home directory set to: $PNPM_HOME"
            echo "pnpm global bin directory set to: $PNPM_BIN_DIR"

            # Clean up global package.json if it exists with empty/invalid entries
            GLOBAL_PKG="$PNPM_HOME/global/5/package.json"
            if [ -f "$GLOBAL_PKG" ]; then
                # Check for invalid selectors and clean them up
                if grep -q '@[^/]*"' "$GLOBAL_PKG" 2>/dev/null; then
                    echo "Warning: Found potentially invalid package selectors in global config"
                    echo "Run 'pnpm list -g' to verify global packages"
                fi
            fi
        else
            echo "pnpm not found, skipping configuration"
        fi
      stdout: true

    - description: Configuring Git - Sensible Defaults
      command: |
        git config --global branch.sort -committerdate
        git config --global column.ui auto
        git config --global diff.algorithm histogram
        git config --global diff.colorMoved plain
        git config --global diff.mnemonicPrefix true
        git config --global diff.renames true
        git config --global fetch.all true
        git config --global fetch.prune true
        git config --global fetch.pruneTags true
        git config --global init.defaultBranch main
        git config --global pull.rebase true
        git config --global push.autoSetupRemote true
        git config --global push.default simple
        git config --global push.followTags true
        git config --global tag.sort version:refname

    - description: Configuring Git - Preferences
      command: |
        git config --global commit.verbose true
        git config --global core.excludesfile ~/.gitignore
        git config --global help.autocorrect prompt
        git config --global rebase.autoSquash true
        git config --global rebase.autoStash true
        git config --global rebase.updateRefs true
        git config --global rerere.enabled true
        git config --global rerere.autoupdate true

    - description: Configuring Git - Aliases
      command: |
        git config --global alias.fpush "push --force-with-lease"
        git config --global alias.dtb "git difftool"
